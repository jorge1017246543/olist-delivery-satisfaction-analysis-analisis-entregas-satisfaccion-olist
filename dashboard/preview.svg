<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Olist: relación entre retrasos y reseñas bajas</title>
  <desc id="desc">Comparación de reseñas bajas por puntualidad y por duración del atraso, con métricas generales del análisis.</desc>
  <rect width="1200" height="760" rx="28" fill="#0d1425"/>
  <text x="56" y="64" fill="#91a2bd" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="2">ANÁLISIS DE E-COMMERCE · OLIST · 2016–2018</text>
  <text x="56" y="112" fill="#f3f6fb" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Las entregas tardías coinciden con más reseñas bajas</text>
  <text x="56" y="145" fill="#aab6c9" font-family="Segoe UI, Arial, sans-serif" font-size="17">La proporción de reseñas de 1–2 puntos es 6,76 veces mayor cuando el pedido llega tarde.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="176" width="344" height="106" rx="16" fill="#151f33" stroke="#27354c"/>
    <text x="80" y="211" fill="#91a2bd" font-size="14">PEDIDOS TARDÍOS</text>
    <text x="80" y="254" fill="#f3f6fb" font-size="34" font-weight="700">6,77%</text>
    <text x="223" y="254" fill="#91a2bd" font-size="15">6.534 de 96.470</text>

    <rect x="428" y="176" width="344" height="106" rx="16" fill="#151f33" stroke="#27354c"/>
    <text x="452" y="211" fill="#91a2bd" font-size="14">DEMORA MEDIA SI LLEGA TARDE</text>
    <text x="452" y="254" fill="#f3f6fb" font-size="34" font-weight="700">10,62</text>
    <text x="574" y="254" fill="#91a2bd" font-size="15">días calendario</text>

    <rect x="800" y="176" width="344" height="106" rx="16" fill="#151f33" stroke="#27354c"/>
    <text x="824" y="211" fill="#91a2bd" font-size="14">PEDIDOS CON RESEÑA</text>
    <text x="824" y="254" fill="#f3f6fb" font-size="34" font-weight="700">95.824</text>
    <text x="958" y="254" fill="#91a2bd" font-size="15">pedidos analizados</text>

    <rect x="56" y="308" width="1088" height="210" rx="18" fill="#151f33" stroke="#27354c"/>
    <text x="84" y="346" fill="#f3f6fb" font-size="20" font-weight="700">Reseñas bajas según puntualidad</text>
    <text x="84" y="371" fill="#91a2bd" font-size="14">Porcentaje de pedidos con promedio de reseña ≤ 2 · solo pedidos con reseña</text>
    <text x="84" y="415" fill="#dce5f2" font-size="16">A tiempo o antes</text>
    <rect x="272" y="394" width="560" height="28" rx="8" fill="#202d43"/>
    <rect x="272" y="394" width="73.8" height="28" rx="8" fill="#46d6b0"/>
    <text x="362" y="414" fill="#f3f6fb" font-size="16" font-weight="700">9,23% · n = 89.443</text>
    <text x="84" y="463" fill="#dce5f2" font-size="16">Tarde</text>
    <rect x="272" y="442" width="560" height="28" rx="8" fill="#202d43"/>
    <rect x="272" y="442" width="498.9" height="28" rx="8" fill="#ff7b72"/>
    <text x="788" y="462" fill="#f3f6fb" font-size="16" font-weight="700">62,36% · n = 6.381</text>
    <rect x="56" y="544" width="1088" height="162" rx="18" fill="#151f33" stroke="#27354c"/>
    <text x="84" y="580" fill="#f3f6fb" font-size="20" font-weight="700">El riesgo aumenta con la duración del atraso</text>
    <g fill="#91a2bd" font-size="13">
      <text x="84" y="626">0 o menos</text>
      <text x="84" y="652">1–3 días</text>
      <text x="84" y="678">4–7 días</text>
      <text x="474" y="626">8–14 días</text>
      <text x="474" y="652">15+ días</text>
    </g>
    <g>
      <rect x="180" y="610" width="245" height="16" rx="8" fill="#202d43"/><rect x="180" y="610" width="22.6" height="16" rx="8" fill="#46d6b0"/>
      <rect x="180" y="636" width="245" height="16" rx="8" fill="#202d43"/><rect x="180" y="636" width="78.8" height="16" rx="8" fill="#f5bd5b"/>
      <rect x="180" y="662" width="245" height="16" rx="8" fill="#202d43"/><rect x="180" y="662" width="165.5" height="16" rx="8" fill="#ff9871"/>
      <rect x="570" y="610" width="245" height="16" rx="8" fill="#202d43"/><rect x="570" y="610" width="196.2" height="16" rx="8" fill="#ff7b72"/>
      <rect x="570" y="636" width="245" height="16" rx="8" fill="#202d43"/><rect x="570" y="636" width="191.6" height="16" rx="8" fill="#ff7b72"/>
    </g>
    <g fill="#e9eef7" font-size="14" font-weight="700">
      <text x="438" y="623">9,23%</text><text x="438" y="649">32,18%</text><text x="438" y="675">67,56%</text>
      <text x="830" y="623">80,08%</text><text x="830" y="649">78,20%</text>
    </g>
    <text x="84" y="735" fill="#91a2bd" font-size="13">Asociación descriptiva; no demuestra causalidad. Fuente: Brazilian E-Commerce Public Dataset by Olist.</text>
  </g>
</svg>
